    entrypoint: ["bash", "/ots/myaac/entrypoint.sh"]
    command: ["apache2-foreground"]   # nadpisany entrypoint kasuje domyslne CMD obrazu
    volumes:
      - './ots/storeimages:/var/www/html/ots-store:ro'
