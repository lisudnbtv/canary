---
# Lokalne dodatki OTS: wlasne skrypty Lua montowane do gotowego obrazu serwera
# oraz mapa trzymana na dysku, zeby nie pobierac jej przy kazdym starcie.
# Nadpisane sa tez pojedyncze skrypty questow przerobione pod jednego gracza.
# Mape tworzy C:\OTS\restart.bat (kopiuje ja z dzialajacego kontenera).
services:
  server:
    volumes:
      - '../data-otservbr-global/scripts/ots:/canary/data-otservbr-global/scripts/ots:ro'
      - '../data-otservbr-global/world/otservbr.otbm:/canary/data-otservbr-global/world/otservbr.otbm:ro'
      - '../data-otservbr-global/scripts/quests/the_pits_of_inferno_quest/movements_throne.lua:/canary/data-otservbr-global/scripts/quests/the_pits_of_inferno_quest/movements_throne.lua:ro'
      - '../data-otservbr-global/scripts/quests/the_annihilator/lever.lua:/canary/data-otservbr-global/scripts/quests/the_annihilator/lever.lua:ro'
      - '../data-otservbr-global/scripts/quests/in_service_of_yalahar/actions_reward.lua:/canary/data-otservbr-global/scripts/quests/in_service_of_yalahar/actions_reward.lua:ro'
      - '../data-otservbr-global/scripts/quests/soul_war/action-reward_soul_war.lua:/canary/data-otservbr-global/scripts/quests/soul_war/action-reward_soul_war.lua:ro'
      - '../data-otservbr-global/world/custom/ots-hub.otbm:/canary/data-otservbr-global/world/custom/ots-hub.otbm:ro'
      - '../data-otservbr-global/world/custom/ots-hub-monster.xml:/canary/data-otservbr-global/world/custom/ots-hub-monster.xml:ro'
      - '../data-otservbr-global/world/custom/ots-hub-house.xml:/canary/data-otservbr-global/world/custom/ots-hub-house.xml:ro'
      - '../data-otservbr-global/world/custom/ots-hub-npc.xml:/canary/data-otservbr-global/world/custom/ots-hub-npc.xml:ro'
      - '../data-otservbr-global/world/custom/ots-hub-zones.xml:/canary/data-otservbr-global/world/custom/ots-hub-zones.xml:ro'
